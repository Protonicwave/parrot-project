<!doctype html>
<html lang="ne" data-ground="dawn" data-locale="ne" data-state="ready">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7D2A8">
<title>सूर्यमुखी रक्षक</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/styles/app.css">
</head>
<body>

<button type="button" id="surface" class="surface"></button>

<div class="screen">

  <header class="top">
    <div class="toggle">
      <button type="button" id="chooseNepali" class="option devanagari" lang="ne">नेपाली</button>
      <button type="button" id="chooseEnglish" class="option latin" lang="en">EN</button>
    </div>
  </header>

  <div class="grow"></div>

  <section class="stage">

    <div id="readyBlock" class="block">
      <svg class="mark" width="56" height="64" viewBox="0 0 56 64" aria-hidden="true">
        <path d="M5 3L52 32L5 61Z" fill="currentColor"></path>
      </svg>
      <h1 id="actionWord" class="action"></h1>
      <p id="durationLine" class="sub"></p>
    </div>

    <div id="playingBlock" class="block" hidden>
      <p class="status"><span class="dot"></span><span id="statusWord"></span></p>
      <p class="countdown"><span id="countdownValue"></span><span id="remainingWord" class="sub"></span></p>
      <p class="stopRow"><span class="stopMark"></span><span id="stopWord"></span></p>
    </div>

    <div id="finishedBlock" class="block" hidden>
      <svg class="mark tick" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12.5l5.2 5.2L20 7"></path>
      </svg>
      <h1 id="finishedWord" class="action"></h1>
      <p id="pressAgainLine" class="sub wrap"></p>
    </div>

  </section>

  <div class="grow"></div>

  <footer class="foot">
    <p id="hintLine" class="hint"></p>

    <div id="ticks" class="ticks">
      <div class="rail"></div>
      <div id="railSpent" class="rail spent"></div>
      <div id="playhead" class="playhead" hidden></div>
    </div>

    <p id="soundedLine" class="sub" hidden></p>

    <div class="meta">
      <p id="dayLine" class="sub"></p>
      <button type="button" id="trackChip" class="chip"></button>
    </div>

    <p class="volume">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5L6 9H3v6h3l5 4V5z"></path>
        <path d="M16.5 8.5a5 5 0 010 7"></path>
        <path d="M19.5 5.5a9 9 0 010 13"></path>
      </svg>
      <span id="volumeLine"></span>
    </p>
  </footer>

</div>

<audio id="audio" preload="none"></audio>

<script type="module" src="src/main.js"></script>
</body>
</html>
