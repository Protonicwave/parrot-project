<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500;600&family=Noto+Serif+Devanagari:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #F3EEE4; }
    a { color: #B0521A; } a:hover { color: #8C3F12; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F3EEE4; color: #1B1813; font-family: 'Spectral', Georgia, serif; line-height: 1.7; display: flex; flex-direction: column; padding: 56px 26px 30px; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
    <div style="font-size: 15px; font-weight: 600; letter-spacing: 0.02em;">Sunflower Guard</div>
    <div style="display: flex; height: 44px; border: 1px solid #D2C9B8; border-radius: 3px; overflow: hidden; align-items: stretch;">
      <div style="display: flex; align-items: center; padding: 0 14px; color: #7E7669; font-size: 15px; font-family: 'Noto Serif Devanagari', serif;">नेपाली</div>
      <div style="display: flex; align-items: center; padding: 0 14px; background: #1B1813; color: #F3EEE4; font-size: 15px; font-weight: 500;">EN</div>
    </div>
  </div>

  <div style="height: 2px; background: #1B1813; margin: 20px 0 0;"></div>
  <div style="height: 1px; background: #1B1813; margin: 3px 0 0;"></div>

  <div style="display: flex; align-items: center; gap: 9px; padding: 26px 0 0;">
    <div style="width: 8px; height: 8px; border-radius: 50%; background: #B0521A;"></div>
    <div style="font-size: 11px; letter-spacing: 0.18em; color: #B0521A;">PLAYING</div>
  </div>

  <div style="display: flex; align-items: baseline; gap: 12px; padding: 12px 0 0;">
    <div style="font-size: 76px; font-weight: 400; line-height: 0.92; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">10:48</div>
    <div style="font-size: 16px; color: #7E7669;">left</div>
  </div>
  <div style="font-size: 15px; color: #4A443B; padding: 10px 0 0;">Evening session, track 3</div>

  <div style="position: relative; height: 18px; margin: 26px 0 0;">
    <div style="position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: #E0D8C9;"></div>
    <div style="position: absolute; left: 0; width: 28%; top: 8px; height: 2px; background: #1B1813;"></div>
    <div style="position: absolute; left: 4%; top: 3px; width: 2px; height: 12px; background: #9A9082;"></div>
    <div style="position: absolute; left: 17%; top: 3px; width: 2px; height: 12px; background: #9A9082;"></div>
    <div style="position: absolute; left: 24%; top: 3px; width: 2px; height: 12px; background: #9A9082;"></div>
    <div style="position: absolute; left: 28%; top: 0; width: 2px; height: 18px; background: #B0521A;"></div>
    <div style="position: absolute; left: 41%; top: 3px; width: 2px; height: 12px; background: #C8BFAE;"></div>
    <div style="position: absolute; left: 58%; top: 3px; width: 2px; height: 12px; background: #C8BFAE;"></div>
    <div style="position: absolute; left: 73%; top: 3px; width: 2px; height: 12px; background: #C8BFAE;"></div>
    <div style="position: absolute; left: 91%; top: 3px; width: 2px; height: 12px; background: #C8BFAE;"></div>
  </div>
  <div style="display: flex; justify-content: space-between; font-size: 12px; color: #7E7669; padding: 9px 0 0;">
    <div>3 of 7 sounded</div>
    <div>next in about 2 min</div>
  </div>

  <div style="height: 1px; background: #D9D1C2; margin: 26px 0 0;"></div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 0 0;">
    <div style="font-size: 16px; color: #4A443B;">Season day</div>
    <div style="font-size: 16px; font-weight: 600;">9 <span style="color: #9A9082; font-weight: 400;">/ 30</span></div>
  </div>

  <div style="height: 1px; background: #D9D1C2; margin: 16px 0 0;"></div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 0 0;">
    <div style="font-size: 16px; color: #4A443B;">Tomorrow</div>
    <div style="font-size: 16px;">Track 4</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 14px;">
    <div style="height: 62px; border: 1.5px solid #1B1813; color: #1B1813; border-radius: 3px; display: flex; align-items: center; justify-content: center; gap: 12px;">
      <div style="width: 15px; height: 15px; background: #1B1813;"></div>
      <div style="font-size: 17px; font-weight: 500;">Stop</div>
    </div>
    <div style="text-align: center; font-size: 12.5px; color: #7E7669;">Keep the speaker at full volume</div>
  </div>

</div>
</x-dc>
</body>
</html>
