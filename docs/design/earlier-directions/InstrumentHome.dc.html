<!doctype html>
<html>

  <div style="display: flex; flex-direction: column; gap: 11px;">

      <div style="position: absolute; left: 73%; top: 2px; width: 1px; height: 11px; background: #57452A;"></div>
      <div style="position: absolute; left: 91%; top: 2px; width: 1px; height: 11px; background: #57452A;"></div>

    <div style="display: flex; justify-content: space-between; font-size: 14px; color: #6E6A64;">
      <div>१५ मिनेट</div>
      <div>७ वटा आवाज</div>
