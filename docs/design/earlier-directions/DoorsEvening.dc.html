<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #1B1F2D; }
    a { color: #D8903A; } a:hover { color: #E8A94F; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; line-height: 1.7; font-family: 'Archivo', system-ui, sans-serif;">

  <div style="height: 374px; background: #DDD5C6; color: #8A8272; display: flex; flex-direction: column; padding: 56px 28px 0; box-sizing: border-box;">

    <div style="display: flex; justify-content: flex-end;">
      <div style="display: flex; height: 44px; border: 1px solid rgba(43,32,16,0.18); border-radius: 999px; overflow: hidden; align-items: stretch;">
        <div style="display: flex; align-items: center; padding: 0 15px; color: rgba(43,32,16,0.42); font-size: 15px; font-weight: 500; font-family: 'Noto Sans Devanagari', sans-serif;">नेपाली</div>
        <div style="display: flex; align-items: center; padding: 0 15px; background: #2B2010; color: #DDD5C6; font-size: 15px; font-weight: 600;">EN</div>
      </div>
    </div>

    <div style="flex-grow: 1;"></div>

    <svg width="52" height="34" viewBox="0 0 76 44" fill="none" aria-hidden="true">
      <circle cx="38" cy="32" r="17" fill="#BFB5A2"></circle>
      <path d="M2 32h14M60 32h14" stroke="#A89E8B" stroke-width="2.2" stroke-linecap="round"></path>
      <path d="M38 2v9M15.5 9.5l6 6M60.5 9.5l-6 6" stroke="#BFB5A2" stroke-width="2.2" stroke-linecap="round"></path>
    </svg>

    <div style="font-size: 46px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; padding: 12px 0 0;">Morning</div>
    <div style="font-size: 17px; color: #9B9382; padding: 4px 0 0;">5:30 – 5:45</div>
    <div style="display: flex; align-items: center; gap: 9px; padding: 14px 0 34px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9B9382" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12.5l5.2 5.2L20 7"></path>
      </svg>
      <div style="font-size: 15px; color: #9B9382;">Done today</div>
    </div>

  </div>

  <div style="height: 470px; background: #1B1F2D; color: #EDE7D9; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 28px 40px; box-sizing: border-box;">

    <svg width="52" height="52" viewBox="0 0 44 44" fill="none" aria-hidden="true">
      <path d="M31 26.5A13 13 0 1117.5 13a10.5 10.5 0 0013.5 13.5z" fill="none" stroke="#D8903A" stroke-width="2.2" stroke-linejoin="round"></path>
    </svg>

    <div style="font-size: 60px; font-weight: 700; line-height: 1.06; letter-spacing: -0.02em; padding: 16px 0 0;">Evening</div>
    <div style="font-size: 19px; color: #8E93A4; padding: 5px 0 0;">5:15 – 5:30</div>

    <div style="display: flex; align-items: center; gap: 13px; padding: 30px 0 0;">
      <div style="width: 52px; height: 52px; border-radius: 50%; background: #D8903A; display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="19" viewBox="0 0 17 19" fill="none" aria-hidden="true">
          <path d="M3 1.5L15.5 9.5L3 17.5Z" fill="#1B1F2D"></path>
        </svg>
      </div>
      <div style="font-size: 18px; font-weight: 600;">Press to play</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
