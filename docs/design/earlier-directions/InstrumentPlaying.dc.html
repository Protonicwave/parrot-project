<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #0C0C0D; }
    a { color: #C9902F; } a:hover { color: #E0A93D; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0C0C0D; color: #E9E4DA; font-family: 'IBM Plex Sans', system-ui, sans-serif; line-height: 1.7; display: flex; flex-direction: column; padding: 56px 28px 34px; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
    <div style="font-size: 15px; font-weight: 600; letter-spacing: 0.01em;">Sunflower Guard</div>
    <div style="display: flex; height: 44px; border: 1px solid #26262B; border-radius: 999px; overflow: hidden; align-items: stretch;">
      <div style="display: flex; align-items: center; padding: 0 15px; color: #6E6A64; font-size: 15px; font-weight: 500; font-family: 'Noto Sans Devanagari', sans-serif;">नेपाली</div>
      <div style="display: flex; align-items: center; padding: 0 15px; background: #1A1713; color: #C9902F; font-size: 15px; font-weight: 600;">EN</div>
    </div>
  </div>

  <div style="height: 1px; background: #1D1D21; margin: 22px 0 0;"></div>

  <div style="display: flex; gap: 36px; padding: 18px 0 0;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 10px; letter-spacing: 0.14em; color: #6E6A64;">DAY</div>
      <div style="font-size: 19px; font-weight: 600;">9 <span style="color: #55524D; font-weight: 400;">/ 30</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 10px; letter-spacing: 0.14em; color: #6E6A64;">TRACK</div>
      <div style="font-size: 19px; font-weight: 600;">3</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 26px;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <div style="width: 7px; height: 7px; border-radius: 50%; background: #C9902F;"></div>
      <div style="font-size: 12px; letter-spacing: 0.16em; color: #C9902F;">PLAYING</div>
    </div>

    <div style="position: relative; width: 244px; height: 244px;">
      <div style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 32%, #1C1C1F 0%, #101012 62%, #0A0A0B 100%); border: 1px solid #2A251C; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 24px 60px rgba(0,0,0,0.75);"></div>
      <svg width="244" height="244" viewBox="0 0 244 244" style="position: absolute; inset: 0; transform: rotate(-90deg);" aria-hidden="true">
        <circle cx="122" cy="122" r="113" fill="none" stroke="#22201C" stroke-width="2"></circle>
        <circle cx="122" cy="122" r="113" fill="none" stroke="#C9902F" stroke-width="2" stroke-linecap="round" stroke-dasharray="199 511"></circle>
      </svg>
      <div style="position: absolute; inset: 31px; border-radius: 50%; border: 1px solid rgba(201,144,47,0.30); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 40px rgba(201,144,47,0.05);">
        <div style="width: 46px; height: 46px; border-radius: 5px; background: #C9902F;"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <div style="font-size: 30px; font-weight: 500; letter-spacing: 0.02em; font-variant-numeric: tabular-nums;">10:48</div>
      <div style="font-size: 12px; color: #6E6A64; letter-spacing: 0.04em;">remaining · morning session</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 11px;">
    <div style="position: relative; height: 16px;">
      <div style="position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: #1F1F23;"></div>
      <div style="position: absolute; left: 0; width: 28%; top: 7px; height: 1px; background: #4A3B22;"></div>
      <div style="position: absolute; left: 4%; top: 2px; width: 1px; height: 11px; background: #3B301D;"></div>
      <div style="position: absolute; left: 17%; top: 2px; width: 1px; height: 11px; background: #3B301D;"></div>
      <div style="position: absolute; left: 24%; top: 2px; width: 1px; height: 11px; background: #3B301D;"></div>
      <div style="position: absolute; left: 28%; top: 0; width: 2px; height: 15px; background: #C9902F;"></div>
      <div style="position: absolute; left: 41%; top: 2px; width: 1px; height: 11px; background: #7A6234;"></div>
      <div style="position: absolute; left: 58%; top: 2px; width: 1px; height: 11px; background: #7A6234;"></div>
      <div style="position: absolute; left: 73%; top: 2px; width: 1px; height: 11px; background: #7A6234;"></div>
      <div style="position: absolute; left: 91%; top: 2px; width: 1px; height: 11px; background: #7A6234;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #6E6A64;">
      <div>3 of 7 sounded</div>
      <div>next in about 2 min</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; margin-top: 24px; padding-top: 18px; border-top: 1px solid #1D1D21;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A857E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5L6 9H3v6h3l5 4V5z"></path>
      <path d="M16.5 8.5a5 5 0 010 7"></path>
      <path d="M19.5 5.5a9 9 0 010 13"></path>
    </svg>
    <div style="font-size: 12.5px; color: #8A857E;">Keep the speaker at full volume</div>
  </div>

</div>
</x-dc>
</body>
</html>
