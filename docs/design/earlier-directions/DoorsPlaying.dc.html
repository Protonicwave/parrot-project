    <div style="height: 62px; border-radius: 6px; background: #2B2010; color: #E7D2A8; display: flex; align-items: center; justify-content: center; gap: 12px;">

      <div style="font-size: 17px; font-weight: 600;">रोक्नुहोस्</div>

      <path d="M31 26.5A13 13 0 1117.5 13a10.5 10.5 0 0013.5 13.5z" fill="none" stroke="#3A4154" stroke-width="2.4" stroke-linejoin="round"></path>

    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
      <div style="font-size: 24px; font-weight: 700; line-height: 1.35; color: #6A7185;">साँझ</div>
      <div style="font-size: 15px; color: #454C5E;">५:१५ – ५:३०</div>
