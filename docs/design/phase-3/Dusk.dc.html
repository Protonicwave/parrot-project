<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #1B1F2D; }
    a { color: #D8903A; } a:hover { color: #B87526; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #1B1F2D; color: #EDE7D9; font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans Devanagari', 'Nirmala UI', sans-serif; line-height: 1.7; display: flex; flex-direction: column; padding: 22px 28px 20px; box-sizing: border-box;">

  <div style="display: flex; justify-content: flex-end;">
    <div style="display: flex; height: 46px; border: 1px solid rgba(237,231,217,0.30); border-radius: 999px; overflow: hidden;">
      <div style="display: flex; align-items: center; min-width: 56px; padding: 0 15px; color: #8E93A4; font-size: 15px; font-weight: 500; font-family: 'Noto Sans Devanagari', 'Nirmala UI', 'Mangal', 'Kohinoor Devanagari', system-ui, sans-serif;">नेपाली</div>
      <div style="display: flex; align-items: center; min-width: 56px; padding: 0 15px; background: #EDE7D9; color: #1B1F2D; font-size: 15px; font-weight: 600;">EN</div>
    </div>
  </div>

  <div style="flex: 1 1 0; min-height: 12px;"></div>

  <div style="flex: 0 0 auto;">
    <svg width="56" height="64" viewBox="0 0 56 64" style="display: block; color: #D8903A;" aria-hidden="true">
      <path d="M5 3L52 32L5 61Z" fill="currentColor"></path>
    </svg>
    <div style="margin: 18px 0 0; font-size: 60px; font-weight: 700; line-height: 1.08; letter-spacing: -0.02em;">Play</div>
    <div style="margin: 0; color: #8E93A4; font-size: 19px;">Runs until you stop it</div>
  </div>

  <div style="flex: 1 1 0; min-height: 12px;"></div>

  <div style="display: flex; flex-direction: column; gap: 12px;">

    <div style="margin: 0; color: rgba(237,231,217,0.42); font-size: 15px;">Works best at dawn and dusk</div>

    <div style="position: relative; height: 18px;">
      <div style="position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: rgba(237,231,217,0.20);"></div>
      <div style="position: absolute; left: 3.0%; top: 3px; width: 2px; height: 12px; background: rgba(237,231,217,0.42);"></div>
      <div style="position: absolute; left: 13.9%; top: 3px; width: 2px; height: 12px; background: rgba(237,231,217,0.42);"></div>
      <div style="position: absolute; left: 36.0%; top: 3px; width: 2px; height: 12px; background: rgba(237,231,217,0.42);"></div>
      <div style="position: absolute; left: 56.4%; top: 3px; width: 2px; height: 12px; background: rgba(237,231,217,0.42);"></div>
      <div style="position: absolute; left: 78.2%; top: 3px; width: 2px; height: 12px; background: rgba(237,231,217,0.42);"></div>
      <div style="position: absolute; left: 88.3%; top: 3px; width: 2px; height: 12px; background: rgba(237,231,217,0.42);"></div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
      <div style="margin: 0; color: #8E93A4; font-size: 16px;">Day 1 / 30</div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid rgba(237,231,217,0.30); border-radius: 999px; font-size: 15px;">Continuous</div>
        <div style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid rgba(237,231,217,0.30); border-radius: 999px; font-size: 15px;">Track 1</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; margin: 0; padding-top: 10px; border-top: 1px solid rgba(237,231,217,0.16); color: #8E93A4; font-size: 16px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8E93A4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5L6 9H3v6h3l5 4V5z"></path>
        <path d="M16.5 8.5a5 5 0 010 7"></path>
        <path d="M19.5 5.5a9 9 0 010 13"></path>
      </svg>
      <div>Keep the speaker at full volume</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
